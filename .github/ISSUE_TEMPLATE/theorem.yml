name: Theorem ledger item
description: Propose work on one formal or mathematical brick
title: "[THEOREM] "
labels: ["theorem"]
body:
  - type: input
    id: ledger
    attributes:
      label: Ledger ID
      placeholder: X002
    validations:
      required: true
  - type: dropdown
    id: status
    attributes:
      label: Current status
      options: [OPEN, BLOCKED, CANDIDATE, DOCUMENTED, SOURCE-AUDITED, LEAN-SOURCE, LEAN-BUILD]
    validations:
      required: true
  - type: textarea
    id: statement
    attributes:
      label: Exact statement and dependencies
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources / Mathlib API
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance evidence
      description: Required build, oracle, documentation, certificate or external-review evidence.
