name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          build: true
          test: false
      - name: Axiom oracle and placeholder audit
        shell: bash
        run: |
          set -euo pipefail
          root_report="$(mktemp)"
          criterion_report="$(mktemp)"
          trap 'rm -f "$root_report" "$criterion_report"' EXIT

          lake env lean oracle_check.lean 2>&1 | tee "$root_report"
          python3 scripts/check_oracle_coverage.py --report "$root_report"
          python3 scripts/check_no_placeholders.py

          cd subprojects/riemann-one-point-resolvent
          lake exe cache get
          lake build
          lake env lean OnePointResolvent/Oracle.lean 2>&1 | tee "$criterion_report"
          python3 scripts/check_oracle_coverage.py --report "$criterion_report"
          python3 scripts/check_no_placeholders.py

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install pinned Python dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-docs.txt
          -r subprojects/riemann-one-point-resolvent/requirements.txt
          -r subprojects/riemann-one-point-resolvent/requirements-docs.txt
      - run: python -m pip check
      - run: ./scripts/verify_static.sh
