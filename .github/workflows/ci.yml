name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Axiom oracle and placeholder audit
        run: |
          lake env lean oracle_check.lean
          python3 scripts/check_no_placeholders.py
          cd subprojects/riemann-one-point-resolvent
          lake build
          lake env lean OnePointResolvent/Oracle.lean
          python3 scripts/check_no_placeholders.py

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-docs.txt -r subprojects/riemann-one-point-resolvent/requirements.txt -r subprojects/riemann-one-point-resolvent/requirements-docs.txt
      - run: ./scripts/verify_static.sh
