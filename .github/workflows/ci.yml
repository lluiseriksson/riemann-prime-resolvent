name: Lean CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Elan
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf             | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: |
          lean --version
          lake --version

      - name: Consistency scan
        run: python3 scripts/check_consistency.py

      - name: Fetch Mathlib cache
        run: lake exe cache get

      - name: Build
        run: lake build

      - name: Axiom oracle
        run: lake env lean oracle_check.lean

      - name: Upload verification metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-${{ github.sha }}
          path: |
            lean-toolchain
            lakefile.lean
            lake-manifest.json
            oracle_check.lean
