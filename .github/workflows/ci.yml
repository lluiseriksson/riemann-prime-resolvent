name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          test: false
      - name: Axiom oracle and placeholder audit
        shell: bash
        run: |
          set -euo pipefail
          lake env lean oracle_check.lean
          python3 scripts/check_no_placeholders.py
          cd subprojects/riemann-one-point-resolvent
          lake exe cache get
          lake build
          lake env lean OnePointResolvent/Oracle.lean
          python3 scripts/check_no_placeholders.py

  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install pinned Python dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-docs.txt
          -r subprojects/riemann-one-point-resolvent/requirements.txt
          -r subprojects/riemann-one-point-resolvent/requirements-docs.txt
      - run: python -m pip check
      - run: ./scripts/verify_static.sh
