name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "figures/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "requirements-docs.txt"
      - "scripts/check_markdown_links.py"
      - "scripts/check_metadata.py"
      - "scripts/check_workflows.py"
      - "scripts/generate_figures.py"
      - "subprojects/riemann-one-point-resolvent/docs/**"
      - "subprojects/riemann-one-point-resolvent/figures/**"
      - "subprojects/riemann-one-point-resolvent/mkdocs.yml"
      - "subprojects/riemann-one-point-resolvent/requirements.txt"
      - "subprojects/riemann-one-point-resolvent/requirements-docs.txt"
      - "subprojects/riemann-one-point-resolvent/scripts/check_markdown_links.py"
      - "subprojects/riemann-one-point-resolvent/scripts/exact_atomic_certificate.py"
      - "subprojects/riemann-one-point-resolvent/scripts/generate_figures.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install pinned documentation dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-docs.txt
          -r subprojects/riemann-one-point-resolvent/requirements.txt
          -r subprojects/riemann-one-point-resolvent/requirements-docs.txt
      - run: python -m pip check
      - name: Validate generated sources and local links
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_metadata.py
          python scripts/check_workflows.py
          python scripts/generate_figures.py
          python scripts/check_markdown_links.py
          (
            cd subprojects/riemann-one-point-resolvent
            python scripts/exact_atomic_certificate.py --output docs/assets/data/exact_atomic_certificate.json
            python scripts/generate_figures.py
            python scripts/check_markdown_links.py
            python scripts/generate_manifest.py --check
          )
          python scripts/generate_manifest.py --check
      - name: Build canonical root and criterion sites
        shell: bash
        run: |
          set -euo pipefail
          mkdocs build --strict
          (
            cd subprojects/riemann-one-point-resolvent
            mkdocs build --strict --site-dir "${GITHUB_WORKSPACE}/site/criterion"
          )
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
