name: Source release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  release-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install pinned Python dependencies
        run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-docs.txt
          -r subprojects/riemann-one-point-resolvent/requirements.txt
          -r subprojects/riemann-one-point-resolvent/requirements-docs.txt
      - run: python -m pip check
      - name: Require tag/version coherence
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_metadata.py --tag "${GITHUB_REF_NAME}"
      - run: ./scripts/verify.sh
      - name: Build and prove both source archives reproducible
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_release.py
          root_first="$(sha256sum release/*.zip)"
          python scripts/package_release.py
          root_second="$(sha256sum release/*.zip)"
          test "$root_first" = "$root_second"
          (cd release && sha256sum -c -- *.zip.sha256)

          (
            cd subprojects/riemann-one-point-resolvent
            python scripts/package_release.py
            criterion_first="$(sha256sum release/*.zip)"
            python scripts/package_release.py
            criterion_second="$(sha256sum release/*.zip)"
            test "$criterion_first" = "$criterion_second"
            cd release
            sha256sum -c -- *.zip.sha256
          )
      - name: Attest canonical monorepo archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*.zip
      - name: Attest criterion-subproject archive
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: subprojects/riemann-one-point-resolvent/release/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: riemann-resolvent-source-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 90
          path: |
            release/*.zip
            release/*.sha256
            subprojects/riemann-one-point-resolvent/release/*.zip
            subprojects/riemann-one-point-resolvent/release/*.sha256
