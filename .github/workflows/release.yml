name: Release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra
      - run: REQUIRE_LEAN=1 ./scripts/verify.sh
      - run: python scripts/make_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: source-release
          path: |
            release/*.zip
            release/*.sha256
