name: Source release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y graphviz
      - run: python -m pip install --upgrade pip
      - run: >-
          python -m pip install
          -r requirements.txt
          -r requirements-docs.txt
          -r subprojects/riemann-one-point-resolvent/requirements.txt
          -r subprojects/riemann-one-point-resolvent/requirements-docs.txt
      - run: ./scripts/verify.sh
      - name: Build and prove reproducible source archive
        shell: bash
        run: |
          python scripts/package_release.py
          first="$(sha256sum release/*.zip)"
          python scripts/package_release.py
          second="$(sha256sum release/*.zip)"
          test "$first" = "$second"
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riemann-prime-resolvent-source
          if-no-files-found: error
          path: |
            release/*.zip
            release/*.sha256
