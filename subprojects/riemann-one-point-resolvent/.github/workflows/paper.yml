name: Paper

on:
  push:
    paths:
      - "paper/**"
      - "scripts/build_paper.sh"
      - "scripts/numerical_demo.py"
      - "scripts/exact_atomic_certificate.py"
      - ".github/workflows/paper.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra
      - run: ./scripts/build_paper.sh
      - uses: actions/upload-artifact@v4
        with:
          name: one-point-resolvent-paper
          path: paper/one_point_resolvent_hausdorff.pdf
