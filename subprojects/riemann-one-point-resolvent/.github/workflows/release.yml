name: Source release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  release-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install pinned Python dependencies
        run: python -m pip install -r requirements.txt -r requirements-docs.txt
      - run: python -m pip check
      - name: Require tag/version coherence
        if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/check_metadata.py --tag "${GITHUB_REF_NAME}"
      - run: ./scripts/verify.sh
      - name: Build and prove reproducible source archive
        shell: bash
        run: |
          set -euo pipefail
          python scripts/package_release.py
          first="$(sha256sum release/*.zip)"
          python scripts/package_release.py
          second="$(sha256sum release/*.zip)"
          test "$first" = "$second"
          (cd release && sha256sum -c -- *.zip.sha256)
      - name: Attest source archive provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: release/*.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: riemann-one-point-resolvent-source-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 90
          path: |
            release/*.zip
            release/*.sha256
