name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "figures/**"
      - "mkdocs.yml"
      - "requirements.txt"
      - "requirements-docs.txt"
      - "scripts/check_markdown_links.py"
      - "scripts/check_metadata.py"
      - "scripts/check_workflows.py"
      - "scripts/exact_atomic_certificate.py"
      - "scripts/generate_figures.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  MPLBACKEND: Agg
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz
      - name: Install pinned documentation dependencies
        run: python -m pip install -r requirements.txt -r requirements-docs.txt
      - run: python -m pip check
      - name: Validate and build documentation
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_metadata.py
          python scripts/check_workflows.py
          python scripts/exact_atomic_certificate.py --output docs/assets/data/exact_atomic_certificate.json
          python scripts/generate_figures.py
          python scripts/check_markdown_links.py
          python scripts/generate_manifest.py --check
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
