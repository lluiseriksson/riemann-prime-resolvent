name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
      - name: Axiom audit
        run: lake env lean PrimeResolvent/Oracle.lean
      - name: Placeholder audit
        run: |
          python3 scripts/check_no_placeholders.py
          python3 scripts/static_lean_sanity.py

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/exact_atomic_certificate.py --output-dir data/certificates
      - run: python scripts/check_release.py
